name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: python -m pip install "ruff==0.17.1" "pytest>=9,<10"
      - name: Lint
        run: ruff check .
      - name: Shell syntax
        run: bash -n bin/run_worker.sh
      - name: Tests
        run: python -m pytest -q tests
      - name: Hygiene (no non-English text, no addresses, no internal names)
        run: |
          fail=0
          if grep -rInP '[\x{0400}-\x{04FF}]' --exclude-dir=.git .; then fail=1; fi
          if grep -rInP '(?<![\w.])(\d{1,3}\.){3}\d{1,3}(?![\w.])' --exclude-dir=.git .; then fail=1; fi
          if grep -rIn '/hom[e]/' --exclude-dir=.git .; then fail=1; fi
          exit $fail
